<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search GIPHY and copy a GIF link in one click." />
    <title>IDGIF: GIF search</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#results">Skip to results</a>

    <header class="site-header">
      <h1>IDGIF</h1>
      <p class="tagline">Find a GIF, select it, and the link is on your clipboard.</p>

      <form id="search-form" class="search" role="search">
        <label for="search-input">Search GIFs</label>
        <div class="search-row">
          <input id="search-input" name="q" type="search" autocomplete="off" enterkeyhint="search" />
          <button type="submit">Search</button>
          <button type="button" id="surprise" class="secondary">Surprise me</button>
        </div>
      </form>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="results" class="results" aria-label="Search results"></ul>
    </main>

    <footer class="site-footer">
      <p id="attribution">Powered by GIPHY</p>
    </footer>
  </body>
</html>
