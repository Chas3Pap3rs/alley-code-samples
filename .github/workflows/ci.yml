name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [before-after-slider, vanilla-gif-search, price-estimator]
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.sample }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type-check and build
        if: matrix.sample != 'vanilla-gif-search'
        run: npm run build
